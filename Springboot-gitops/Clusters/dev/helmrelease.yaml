apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: springboot
  namespace: flux-system   # 1. The HelmRelease custom resource lives here
spec:
  interval: 5m
  targetNamespace: flux-system   # 2. Tell Helm to deploy the actual app resources here too
  chart:
    spec:
      chart: ./apps/springboot/chart
      sourceRef:
        kind: GitRepository
        name: cluster-config
        namespace: flux-system
      interval: 5m
  values:
    replicaCount: 2
    image:
      repository: runity77/springboot-demo
      tag: "59"