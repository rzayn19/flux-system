apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: springboot
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: flux-system
  chart:
    spec:
      chart: ./apps/springboot/chart
      sourceRef:
        kind: GitRepository
        name: cluster-config   # Change this from flux-system to cluster-config
        namespace: flux-system
      interval: 5m
  values:
    replicaCount: 2
    image:
      repository: runity77/springboot-demo
      tag: "59"